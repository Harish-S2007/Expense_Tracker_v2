apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expense-v2-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-v2
  template:
    metadata:
      labels:
        app: expense-v2
    spec:
      containers:
        - name: expense-v2
          image: expense-tracker:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATA_DIR
              value: /app/data
          volumeMounts:
            - name: expense-v2-storage
              mountPath: /app/data
      volumes:
        - name: expense-v2-storage
          persistentVolumeClaim:
            claimName: expense-v2-data

---
apiVersion: v1
kind: Service
metadata:
  name: expense-v2-service
spec:
  type: NodePort
  selector:
    app: expense-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082